[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papertrail"
version = "0.1.0"
description = "Citation-verified RAG over arXiv CS papers, with an evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "httpx>=0.27",
    "arxiv>=2.1",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]