services:
  db:
    image: pgvector/pgvector:pg16
    container_name: papertrail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papertrail}
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: papertrail-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf_cache:/home/app/.cache/huggingface

volumes:
  pgdata:
  hf_cache:
