services:
  db:
    image: pgvector/pgvector:pg16
    container_name: papertrail-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papertrail}
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: